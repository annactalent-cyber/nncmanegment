<!DOCTYPE html>
<html>
<body>
  <h1>Portraits</h1>
  <div style="display: flex; flex-wrap: wrap;">
    <script>
      for(let i=1; i<=13; i++) {
        let num = String(i).padStart(2, '0');
        document.write(\`<div style="margin: 10px;">
          <h3>portre_\${num}.png</h3>
          <img src="upload/product_gallery/portre_\${num}.png" style="width: 200px; height: auto;">
        </div>\`);
      }
    </script>
  </div>
</body>
</html>
